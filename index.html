<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cribbage — Timothy Hadfield</title>
<meta name="description" content="Play cribbage to 121 on a wooden peg board against a measured computer opponent or a friend online, with undo, a count review and muggins.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/table.css?v=20261027f">
<link rel="stylesheet" href="css/profile.css?v=20261027g">
<style>
  /* Palette lifted from the Board & Card Games hub so this reads as a sibling
     of the other projects rather than a stray page. */
  :root {
    --bg: #0f1117;
    --bg-soft: #161923;
    --card: #1a1e2b;
    --card-hover: #212636;
    --line: #2a3042;
    --text: #e8eaf0;
    --muted: #969db4;
    --accent: #6ea8fe;
    --accent-warm: #f0b354;
    --good: #6ee7a8;
    --bad: #f08c8c;
    --you: #4f8df0;
    --opp: #e08a2c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --radius: 12px;
    --card-w: 60px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ------------------------------------------------------------- buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600;
    transition: background .12s, border-color .12s, transform .06s;
  }
  .btn:hover:not(:disabled) { background: var(--card-hover); border-color: #3a4258; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.primary:hover:not(:disabled) { background: #86b8ff; border-color: #86b8ff; }
  .btn.ghost { background: rgba(15,17,23,.55); }
  .btn.small { padding: 7px 12px; font-size: 14px; border-radius: 8px; }
  .icon-btn {
    width: 38px; height: 38px; display: inline-grid; place-items: center; flex: none;
    background: transparent; border: 0; border-radius: 9px; color: var(--muted); cursor: pointer; padding: 0;
  }
  .icon-btn:hover:not(:disabled) { background: var(--card); color: var(--text); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .icon-btn svg { width: 22px; height: 22px; }
  .q {
    width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0; margin-left: 6px; flex: none;
  }

  /* ------------------------------------------------------------- screens */
  .screen { display: none; position: fixed; inset: 0; }
  .screen.active { display: flex; flex-direction: column; }

  /* ---------------------------------------------------------------- menu */
  #screen-menu { align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  .menu-card {
    position: relative; width: 100%; max-width: 420px; background: rgba(15,17,23,.92);
    border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow);
  }
  .menu-card h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
  .menu-card .sub { margin: 2px 0 14px; color: var(--muted); font-size: 14px; }
  .menu-board { margin: 0 -4px 14px; }
  .lab-row { display: flex; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 6px; cursor: pointer; text-align: center;
    font-size: 14px; font-weight: 600; transition: background .12s, border-color .12s;
  }
  .seg button:hover { background: var(--card-hover); }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg .lvl-note { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .seg button[aria-pressed="true"] .lvl-note { color: #9dc3ff; }
  .menu-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .menu-actions .btn.primary { grid-column: 1 / -1; padding: 13px; font-size: 17px; }
  .menu-actions .btn.resume { grid-column: 1 / -1; border-color: var(--accent); color: var(--accent); }
  .menu-actions .btn[hidden] { display: none; }
  .menu-links { display: flex; justify-content: center; gap: 4px; margin-top: 12px; flex-wrap: wrap; }
  .menu-links .btn { padding: 7px 10px; font-size: 14px; background: transparent; border-color: transparent; color: var(--muted); }
  .menu-links .btn:hover { color: var(--text); }
  .menu-foot { margin-top: 10px; text-align: center; font-size: 13px; }
  .menu-foot a { color: var(--muted); }
  .daily-done { color: var(--good); font-size: 12px; font-weight: 600; }
  .menu-actions .btn.online { grid-column: 1 / -1; }
  /* online: the lobby sheet + a small message line */
  .net-inp { width: 100%; min-width: 0; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); font: inherit; font-size: 16px; }
  .net-inp:focus { outline: none; border-color: var(--accent); }
  .sheet-body.net .btn.wide { width: 100%; margin-top: 8px; }
  .net-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .net-row .grow { flex: 1; padding: 0; }
  .net-code { font-size: 36px; font-weight: 800; letter-spacing: .2em; text-align: center; color: var(--accent-warm); margin: 2px 0 4px; user-select: all; }
  .sheet-body.net .lab.muted { color: var(--muted); font-style: italic; }
  .set-why.bad { color: var(--bad); }
  .net-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 90; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

  /* ---------------------------------------------------------- game: top */
  .topbar {
    display: flex; align-items: center; gap: 4px; padding: 3px 8px;
    padding-top: max(3px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); flex: none;
  }
  .topbar .title { flex: 1; min-width: 0; padding: 0 4px; line-height: 1.15; }
  .topbar h2 { margin: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .who { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .pf-open { background: transparent; border: 0; padding: 4px; border-radius: 9px; }

  .game-grid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .main-col { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .side-col { display: none; }

  /* ---- the peg board strip ---- */
  .board-wrap { flex: none; background: #2a1a0e; padding: 4px 10px 6px; border-bottom: 1px solid #1a0f06; }
  .scores { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; padding: 0 2px 3px; }
  .sc { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; }
  .sc .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; align-self: center; }
  .sc .nm { overflow: hidden; text-overflow: ellipsis; color: #e9d8c2; }
  .sc .pts { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 800; color: #fff; }
  .sc .gain { font-size: 12px; color: var(--good); font-weight: 700; min-width: 22px; }
  .sc .deals { font-size: 10.5px; color: var(--accent-warm); font-weight: 800; letter-spacing: .05em; }
  .pegboard svg { display: block; width: 100%; height: auto; max-height: 26vh; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .pegboard .peg { will-change: transform; }

  /* ---- the felt ---- */
  .felt { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 12px 6px; position: relative; overflow: hidden; }
  .felt-sec { flex: none; }
  .opp-row { display: flex; align-items: flex-start; gap: 10px; --card-w: 34px; }
  .opp-row .who-box { flex: none; width: 92px; font-size: 13px; line-height: 1.2; padding-top: 2px; }
  .opp-row .who-box .nm { font-weight: 700; color: #f4e6cc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opp-row .who-box .meta { color: #cfe3d6; font-size: 12px; min-height: 15px; }
  .opp-row .who-box .meta.turn { color: var(--accent-warm); font-weight: 700; }
  .opp-cards { flex: 1; min-width: 0; display: flex; gap: 4px; align-items: center; min-height: 46px; flex-wrap: nowrap; }
  .opp-cards .played { opacity: .55; }
  .opp-cards .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.25); margin: 0 3px; }

  .mid { display: flex; align-items: flex-start; gap: 12px; margin-top: 8px; --card-w: 54px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: none; }
  .slot-lab { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #bfe0cc; font-weight: 700; }
  .crib-stack { position: relative; width: var(--card-w); aspect-ratio: 63 / 88; }
  .crib-stack > * { position: absolute; left: 0; top: 0; }
  .crib-stack.is-mine::after {
    content: "yours"; position: absolute; left: 50%; bottom: -15px; transform: translateX(-50%);
    font-size: 10px; color: var(--accent-warm); font-weight: 700;
  }
  .count-col { flex: 1; min-width: 0; }
  .count-head { display: flex; align-items: baseline; gap: 8px; }
  .count-big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .count-cap { font-size: 10px; color: #bfe0cc; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
  .peg-call { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--accent-warm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .seq { display: flex; margin-top: 6px; min-height: calc(var(--card-w) * 88 / 63); --card-w: 46px; }
  .seq .tbl-card { margin-right: calc(var(--card-w) * -0.42); box-shadow: -2px 1px 3px rgba(0,0,0,.25); }
  .seq .tbl-card:last-child { margin-right: 0; }
  .seq .old { opacity: .45; }
  .seq .gap { width: 14px; flex: none; }

  /* ---- the count (show) ---- */
  .count-view { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 6px; --card-w: 60px; }
  .counted { display: flex; align-items: center; gap: 5px; flex: none; }
  .counted .plus { color: #cfe3d6; font-weight: 700; margin: 0 2px; }
  .counted .tbl-card { transition: transform .18s, box-shadow .18s; }
  .counted .tbl-card.hl { transform: translateY(-6px); box-shadow: 0 0 0 2px var(--accent-warm), 0 6px 12px rgba(0,0,0,.4); }
  .bd { flex: 0 1 auto; min-height: 0; overflow-y: auto; margin-top: 8px; background: rgba(8,20,14,.55); border-radius: 10px; padding: 6px 10px; font-size: 13.5px; }
  .bd-item { display: flex; align-items: center; gap: 8px; padding: 2px 0; transition: opacity .2s; }
  .bd-item.wait { opacity: .28; }
  .bd-item .p { font-variant-numeric: tabular-nums; color: var(--good); font-weight: 800; min-width: 24px; }
  .bd-item .l { flex: 1; min-width: 0; }
  .bd-item .cs { color: #dfe7e2; font-size: 12.5px; white-space: nowrap; }
  .cs .red { color: #ff8f86; }
  .bd-total { border-top: 1px solid rgba(255,255,255,.15); margin-top: 4px; padding-top: 4px; font-weight: 800; display: flex; justify-content: space-between; }
  .bd-none { color: #cfe3d6; font-style: italic; }
  .claim-note { font-size: 12.5px; margin-top: 4px; }
  .claim-note.bad { color: var(--bad); }

  /* ---- prompt + actions ---- */
  .prompt-row { flex: none; margin-top: auto; padding-top: 6px; }
  .prompt { background: rgba(10,13,20,.78); border-radius: 10px; padding: 8px 12px; border-left: 3px solid var(--accent); min-height: 44px; }
  .prompt .p-title { font-weight: 700; font-size: 15px; }
  .prompt .p-sub { color: var(--muted); font-size: 13px; }
  .prompt .hint { color: var(--accent-warm); font-size: 13px; margin-top: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; min-height: 40px; align-items: center; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper .val { min-width: 42px; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stepper .btn { width: 40px; padding: 8px 0; }

  /* ---- your hand ---- */
  .hand-row { flex: none; margin-top: 4px; --card-w: 72px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .hand-head { display: flex; justify-content: space-between; font-size: 12px; color: #cfe3d6; padding: 0 2px; height: 16px; }
  .hand-head .turn { color: var(--accent-warm); font-weight: 700; }
  #your-hand .tbl-card { cursor: default; }
  #your-hand .tbl-card.playable { cursor: pointer; }
  #your-hand .tbl-card.dim { filter: brightness(.55); }
  /* played cards shrink and fade, so they never look like "can't play this" */
  #your-hand .tbl-card.played { scale: .84; opacity: .42; filter: grayscale(.7); }
  /* during the count your cards are shown above; the hand row would only repeat them */
  .felt[data-phase="show"] .hand-row { display: none; }
  .bd.ph { flex: none; }

  /* cards: index corner only on small cards (pips get too fine) */
  .tbl-card.mini .tbl-pips, .tbl-card.mini .tbl-pip, .tbl-card.mini .tbl-idx.b { display: none; }
  .tbl-card.mini .tbl-idx { font-size: calc(var(--card-w) * .32); left: 8%; top: 5%; }
  .tbl-card.mini::before { content: attr(data-suit); position: absolute; right: 10%; bottom: 6%; font-size: calc(var(--card-w) * .42); line-height: 1; }
  .tbl-card.focus-ring:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* motion (only added when animations are on) */
  @keyframes in-up { from { transform: translateY(46px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes in-down { from { transform: translateY(-46px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes deal-in { from { transform: translateY(-120px) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .seq .tbl-card.in-up { animation: in-up .32s cubic-bezier(.3,.7,.3,1); }
  .seq .tbl-card.in-down { animation: in-down .32s cubic-bezier(.3,.7,.3,1); }
  .deal-anim > * { animation: deal-in .38s cubic-bezier(.3,.7,.3,1) backwards; }

  /* ---- game over ---- */
  .banner { background: rgba(10,13,20,.86); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; text-align: center; margin-top: 8px; }
  .banner h2 { margin: 0; font-size: 22px; }
  .banner p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .banner .rated { font-size: 12.5px; margin-top: 4px; color: var(--muted); }

  /* ---- sheets (settings, log, rules) ---- */
  .sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 86vh; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 16px; flex: none; }
  .sheet-head h3 { margin: 0; font-size: 17px; flex: 1; }
  .sheet-tabs { display: flex; gap: 6px; padding: 0 16px 8px; flex: none; }
  .sheet-tabs button { flex: 1; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 9px; padding: 7px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .sheet-tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: rgba(110,168,254,.12); }
  .sheet-body { overflow-y: auto; padding: 0 16px 16px; min-height: 0; flex: 1; font-size: 14px; }
  .sheet-body h4 { margin: 14px 0 4px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sheet-body .rules-text { color: var(--muted); }
  .sheet-body .rules-text h4 { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; }
  .sheet-body .rules-text ul { margin: 4px 0; padding-left: 20px; }
  @media (min-width: 900px) {
    .sheet-back { align-items: center; }
    .sheet { border-radius: 16px; max-height: 80vh; }
  }

  .set-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); min-height: 46px; }
  .set-row:first-child { border-top: 0; }
  .set-row .fx-lab, .set-row .lab { flex: 1; min-width: 0; display: flex; align-items: center; }
  .set-row .seg { flex: 0 1 200px; }
  .set-row .seg button { padding: 6px; }
  .set-row.dim { opacity: .5; }
  .set-why { color: var(--muted); font-size: 13px; padding: 0 0 8px; }
  .switch { position: relative; width: 46px; height: 28px; flex: none; display: inline-block; }
  .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 14px; transition: background .18s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .18s; }
  .switch input:checked + span { background: var(--good); }
  .switch input:checked + span::after { transform: translateX(18px); }

  .log-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .log-list li { font-size: 13.5px; color: var(--muted); }
  .log-list li.mine { color: var(--text); }
  .rev { border-top: 1px solid var(--line); padding: 8px 0; }
  .rev:first-child { border-top: 0; }
  .rev-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
  .rev-head .tot { color: var(--good); }
  .rev-cards { font-size: 13px; color: var(--text); margin: 2px 0; }
  .rev-items { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-style: italic; }

  /* in-page confirm */
  .dialog-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dialog { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .dialog-msg { margin: 0 0 14px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* ---------------------------------------------------------- small phones */
  @media (max-width: 350px) {
    .hand-row { --card-w: 56px; }
    .opp-row .who-box { width: 78px; }
    .mid { --card-w: 40px; }
    .count-view { --card-w: 48px; }
  }
  @media (max-height: 600px) and (max-width: 899px) {
    .hand-row { --card-w: 54px; }
    .mid { --card-w: 40px; margin-top: 4px; }
    .seq { --card-w: 34px; }
    .prompt { padding: 6px 10px; }
    .prompt .p-sub, .prompt .hint { font-size: 12.5px; }
    .actions { margin-top: 4px; }
    /* on short screens the result banner says it all */
    .felt[data-phase="gameover"] #prompt { display: none; }
  }
  /* phone on its side: board left, table right */
  @media (max-height: 500px) and (min-width: 560px) {
    .game-grid { flex-direction: row; }
    .main-col { flex-direction: row; }
    .board-wrap { width: 38%; border-bottom: 0; border-right: 1px solid #1a0f06; display: flex; flex-direction: column; justify-content: center; }
    .pegboard svg { max-height: none; }
    .hand-row { --card-w: 46px; }
    .prompt { padding: 5px 10px; min-height: 0; }
    .prompt .p-title { font-size: 14px; }
    .prompt .p-sub, .prompt .hint { font-size: 12px; }
    .actions { margin-top: 4px; }
    .felt[data-phase="gameover"] #prompt { display: none; }
    .mid { --card-w: 36px; margin-top: 2px; }
    .seq { --card-w: 30px; }
    .opp-row { --card-w: 24px; }
    .count-view { --card-w: 46px; }
    .scores { font-size: 12px; gap: 4px; }
    .sc { gap: 4px; }
    .sc .pts { font-size: 16px; }
    .sc .gain { min-width: 0; }
    .prompt:has(.hint) .p-sub { display: none; }   /* the hint says more than the sub-line */
    .opp-cards { min-height: 34px; }
    .felt { padding: 4px 10px; }
  }

  /* ---------------------------------------------------------------- laptop */
  @media (min-width: 900px) {
    .game-grid { flex-direction: row; max-width: 1280px; width: 100%; margin: 0 auto; }
    .main-col { border-right: 1px solid var(--line); }
    .board-wrap { padding: 8px 18px 10px; }
    .pegboard { max-width: 760px; margin: 0 auto; }
    .pegboard svg { max-height: 30vh; }
    .scores { max-width: 760px; margin: 0 auto; width: 100%; font-size: 15px; }

<!-- ================================================ RULES TEXT ========== -->
<template id="rules-text">
  <div class="rules-text">
    <p>Two players race to <strong>121 points</strong>. The winner is whoever gets there
       first — the moment someone reaches 121 the game stops, even mid-count.</p>
    <h4>The deal</h4>
    <p>Six cards each. You both throw two away into the <em>crib</em>, which belongs to
       the dealer and is counted at the end of the hand as a fifth hand. So you throw
       good cards in when it's yours and rubbish in when it isn't. Then the non-dealer
       cuts a <em>starter</em> card, shared by every hand. If it's a jack the dealer
       takes 2 ("his heels").</p>
    <h4>The play</h4>
    <p>You take turns laying cards face up, calling a running total. It may never pass 31.</p>
    <ul>
      <li><strong>2</strong> for making the count exactly 15 or exactly 31</li>
      <li><strong>2 / 6 / 12</strong> for a pair, three of a kind, four of a kind</li>
      <li><strong>3+</strong> for a run of three or more, in any order</li>
      <li><strong>1</strong> if your opponent can't play ("go"), and 1 for the last card</li>
    </ul>
    <h4>The show</h4>
    <p>Each hand is counted with the starter as a fifth card — non-dealer first, then the
       dealer, then the dealer's crib. That order decides close games.</p>
    <ul>
      <li><strong>2</strong> for every combination adding to 15</li>
      <li><strong>2</strong> per pair (so three of a kind is 6, four is 12)</li>
      <li><strong>3+</strong> per run, counted once for each way it can be made</li>
      <li><strong>4</strong> for four cards of one suit, 5 if the starter matches
          — in the crib only a five-card flush counts</li>
      <li><strong>1</strong> for a jack matching the starter's suit ("his nobs")</li>
    </ul>
    <p>The best possible hand is 29. A hand can never be worth 19, which is why
       a worthless hand gets called a nineteen.</p>
    <h4>The board</h4>
    <p>Each player has two pegs. The front one is your score; the back one jumps over it
       each time you score, so the gap shows your last score. Lose before the S line (91)
       and it's a skunk; before SS (61), a double skunk.</p>
    <h4>Muggins (optional, in Settings)</h4>
    <p>You count your own hand and crib. Miss points and the computer takes them.</p>
  </div>
</template>
